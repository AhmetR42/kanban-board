<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kanban Board</title>
    <meta name="description" content="A kanban board with drag and drop, keyboard support and an English/Dutch interface.">
    <meta name="theme-color" content="#1f4a2c">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500&display=swap">
    <link rel="stylesheet" href="css/styles.css">
    <script type="module" src="js/main.js"></script>
</head>
<body>
    <div class="backdrop" aria-hidden="true">
        <span class="glow glow-a"></span>
        <span class="glow glow-b"></span>
    </div>

    <header class="topbar">
        <a class="brand" href="./">
            <svg width="32" height="32" viewBox="0 0 30 30" aria-hidden="true">
                <rect width="30" height="30" rx="9" fill="#b4d361"/>
                <rect x="7" y="8" width="4" height="14" rx="2" fill="#0c2416"/>
                <rect x="13" y="8" width="4" height="9" rx="2" fill="#0c2416" opacity=".7"/>
                <rect x="19" y="8" width="4" height="5" rx="2" fill="#0c2416" opacity=".4"/>
            </svg>
            <span data-i18n="appTitle">Kanban Board</span>
        </a>

        <label class="search">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <span class="visually-hidden" data-i18n="search">Search cards</span>
            <input type="search" id="search" data-i18n-placeholder="search" placeholder="Search cards" autocomplete="off">
            <kbd aria-hidden="true">/</kbd>
        </label>

        <div class="topbar-actions">
            <div class="save">
                <span class="save-status" id="save-status" data-state="saved" role="status">
                    <svg class="icon-saved" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M7 18a4.5 4.5 0 0 1-.6-8.96A6 6 0 0 1 18 8.5a4.75 4.75 0 0 1-.5 9.5z"/><path d="m9.5 13.5 2 2 3.5-4"/></svg>
                    <svg class="icon-saving" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.2-8.56"/></svg>
                    <svg class="icon-unsaved" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="currentColor"/></svg>
                    <span id="save-text">Saved</span>
                </span>
                <label class="switch" data-i18n-title="autosave" title="Auto-save">
                    <input type="checkbox" id="autosave" role="switch" checked>
                    <span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span>
                    <span class="switch-label" data-i18n="autosave">Auto-save</span>
                </label>
                <button type="button" class="icon-button" id="save-now" data-i18n-title="saveNow" title="Save now">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 3h11l3 3v13a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2z"/><path d="M8 3v5h7V3M8 21v-7h8v7"/></svg>
                    <span class="visually-hidden" data-i18n="saveNow">Save now</span>
                </button>
            </div>
            <div class="lang" role="group" data-i18n-label="language" aria-label="Language">
                <span class="lang-thumb" aria-hidden="true"></span>
                <button type="button" data-locale="en">EN</button>
                <button type="button" data-locale="nl">NL</button>
            </div>
            <div class="menu">
                <button type="button" class="icon-button" id="download-toggle" aria-haspopup="true" aria-expanded="false" aria-controls="download-menu" data-i18n-title="download" title="Download">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 4v11m0 0-4-4m4 4 4-4M5 20h14"/></svg>
                    <span class="visually-hidden" data-i18n="download">Download</span>
                </button>
                <div class="menu-list" id="download-menu" hidden>
                    <button type="button" data-export="pdf">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg>
                        <span data-i18n="exportPdf">Printable PDF</span>
                        <small>.pdf</small>
                    </button>
                    <button type="button" data-export="json">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M8 4H7a2 2 0 0 0-2 2v4l-2 2 2 2v4a2 2 0 0 0 2 2h1M16 4h1a2 2 0 0 1 2 2v4l2 2-2 2v4a2 2 0 0 1-2 2h-1"/></svg>
                        <span data-i18n="exportJson">Board file (JSON)</span>
                        <small>.json</small>
                    </button>
                </div>
            </div>
            <label class="icon-button" data-i18n-title="import" title="Import">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 15V4m0 0L8 8m4-4 4 4M5 20h14"/></svg>
                <span class="visually-hidden" data-i18n="import">Import</span>
                <input type="file" id="import" accept="application/json,.json" class="visually-hidden">
            </label>
            <button type="button" class="button button-accent" id="add-card">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
                <span data-i18n="addCard">Add card</span>
            </button>
        </div>
    </header>

    <main class="page">
        <section class="hero">
            <div class="hero-text">
                <p class="eyebrow"><span></span><span data-i18n="eyebrow">Sprint board</span></p>
                <h1><span data-i18n="titleStart">Plan your work,</span> <em data-i18n="titleEnd">drag it to done.</em></h1>
            </div>
            <div class="progress">
                <svg width="60" height="60" viewBox="0 0 52 52" aria-hidden="true">
                    <circle cx="26" cy="26" r="21" class="progress-track"/>
                    <circle cx="26" cy="26" r="21" class="progress-bar" id="progress-bar"/>
                </svg>
                <div>
                    <strong id="progress-percent">0%</strong>
                    <span id="progress-label"></span>
                </div>
            </div>
        </section>

        <div class="filters" role="group" data-i18n-label="priority" aria-label="Priority">
            <button type="button" class="chip" data-priority="" data-i18n="allPriorities">All priorities</button>
            <button type="button" class="chip" data-priority="high" data-i18n="priorities.high">High</button>
            <button type="button" class="chip" data-priority="medium" data-i18n="priorities.medium">Medium</button>
            <button type="button" class="chip" data-priority="low" data-i18n="priorities.low">Low</button>
        </div>

        <p class="visually-hidden" id="move-hint" data-i18n="moveHint">Space to pick up, arrow keys to move, Space to drop, Escape to cancel.</p>
        <div class="board" id="board"></div>
    </main>

    <dialog class="editor" id="editor" aria-labelledby="editor-title">
        <form method="dialog" id="editor-form">
            <header>
                <h2 id="editor-title"></h2>
                <button type="button" class="icon-button" data-close data-i18n-title="close" title="Close">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
                    <span class="visually-hidden" data-i18n="close">Close</span>
                </button>
            </header>

            <label class="field">
                <span data-i18n="title">Title</span>
                <input name="title" required maxlength="120" data-i18n-placeholder="titlePlaceholder" autocomplete="off">
            </label>
            <label class="field">
                <span data-i18n="description">Description</span>
                <textarea name="description" rows="3" maxlength="1000"></textarea>
            </label>
            <div class="field-row">
                <label class="field">
                    <span data-i18n="priority">Priority</span>
                    <select name="priority">
                        <option value="low" data-i18n="priorities.low">Low</option>
                        <option value="medium" data-i18n="priorities.medium">Medium</option>
                        <option value="high" data-i18n="priorities.high">High</option>
                    </select>
                </label>
                <label class="field">
                    <span data-i18n="due">Due date</span>
                    <input type="date" name="due">
                </label>
            </div>
            <label class="field">
                <span data-i18n="tags">Tags</span>
                <input name="tags" autocomplete="off" aria-describedby="tags-hint">
                <small id="tags-hint" data-i18n="tagsHint">Separate with commas</small>
            </label>

            <footer>
                <button type="button" class="button button-danger" id="delete-card" data-i18n="delete">Delete</button>
                <span class="spacer"></span>
                <button type="button" class="button button-ghost" data-close data-i18n="cancel">Cancel</button>
                <button type="submit" class="button button-accent" data-i18n="save">Save</button>
            </footer>
        </form>
    </dialog>

    <div class="toast" id="toast" role="status" hidden>
        <span id="toast-text"></span>
        <button type="button" class="toast-action" id="toast-action" hidden></button>
    </div>
    <div class="visually-hidden" id="announcer" aria-live="assertive"></div>
</body>
</html>
